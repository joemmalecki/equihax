worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Tenant subdomain server block — matches *.equihax.net
    server {
        listen 80;
        server_name ~^(?<tenant>[^.]+)\.equihax\.net$;

        root /var/www/html;
        index index.html;

        location / {
            auth_request /validate-tenant;
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://localhost:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Tenant-ID $tenant;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /validate-tenant {
            internal;
            proxy_pass http://localhost:8080/api/validate_tenant.php;
            proxy_set_header X-Tenant-ID $tenant;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # Bare domain — no tenant specified
    server {
        listen 80;
        server_name equihax.net;
        return 404 "No tenant specified";
    }
}
