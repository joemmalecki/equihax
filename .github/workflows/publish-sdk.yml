name: Publish SDK

on:
  push:
    tags:
      - 'sdk/v*'     # Triggered by tags like sdk/v0.2.0, sdk/v1.0.0

env:
  AWS_REGION: us-east-1
  CODEARTIFACT_DOMAIN: equihax
  CODEARTIFACT_REPO: equihax-sdk
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  # -----------------------------------------------------------------------
  # Always run tests before publishing
  # -----------------------------------------------------------------------
  test:
    name: Test Before Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: sdk
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: sdk
        run: pytest tests/ -v

  # -----------------------------------------------------------------------
  # Build the package and publish to CodeArtifact
  # -----------------------------------------------------------------------
  publish:
    name: Publish to CodeArtifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Extract version from tag
        id: version
        # Tag format: sdk/v0.2.0 → version: 0.2.0
        run: echo "version=${GITHUB_REF#refs/tags/sdk/v}" >> $GITHUB_OUTPUT

      - name: Update version in setup.py
        working-directory: sdk
        run: |
          sed -i "s/version=\".*\"/version=\"${{ steps.version.outputs.version }}\"/" setup.py

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: sdk
        run: python -m build

      - name: Authenticate with CodeArtifact
        run: |
          # Get CodeArtifact auth token (valid for 12 hours)
          export CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ env.CODEARTIFACT_DOMAIN }} \
            --domain-owner ${{ env.AWS_ACCOUNT_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query authorizationToken \
            --output text)

          # Get the CodeArtifact repository endpoint
          export CODEARTIFACT_URL=$(aws codeartifact get-repository-endpoint \
            --domain ${{ env.CODEARTIFACT_DOMAIN }} \
            --domain-owner ${{ env.AWS_ACCOUNT_ID }} \
            --repository ${{ env.CODEARTIFACT_REPO }} \
            --format pypi \
            --region ${{ env.AWS_REGION }} \
            --query repositoryEndpoint \
            --output text)

          # Configure twine to use CodeArtifact
          cat > ~/.pypirc << EOF
          [distutils]
          index-servers = codeartifact

          [codeartifact]
          repository = ${CODEARTIFACT_URL}
          username = aws
          password = ${CODEARTIFACT_TOKEN}
          EOF

          echo "CODEARTIFACT_URL=${CODEARTIFACT_URL}" >> $GITHUB_ENV

      - name: Publish to CodeArtifact
        working-directory: sdk
        run: twine upload --repository codeartifact dist/*

      - name: Confirm published version
        run: |
          echo "Published equihax v${{ steps.version.outputs.version }} to CodeArtifact"
          echo "Install with:"
          echo "  pip install equihax==${{ steps.version.outputs.version }} --index-url ${{ env.CODEARTIFACT_URL }}simple/"
