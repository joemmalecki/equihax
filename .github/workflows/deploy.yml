name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'app/**'        # Only triggers when app code changes

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # -----------------------------------------------------------------------
  # Run PHP tests before building anything
  # -----------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Run PHP tests
        working-directory: app/backend
        run: |
          # Add your PHP test runner here (PHPUnit, Pest, etc.)
          echo "PHP tests passed (add PHPUnit here)"

  # -----------------------------------------------------------------------
  # Build and push nginx image (contains frontend static files)
  # -----------------------------------------------------------------------
  build-nginx:
    name: Build & Push nginx
    runs-on: ubuntu-latest
    needs: test-backend
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push nginx image
        id: build
        working-directory: app/nginx
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/equihax-nginx:${{ github.sha }}
          LATEST=${{ env.ECR_REGISTRY }}/equihax-nginx:latest

          docker build \
            --build-context frontend=../frontend \
            -t $IMAGE \
            -t $LATEST \
            .

          docker push $IMAGE
          docker push $LATEST

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # Build and push Apache/PHP image (contains backend code)
  # -----------------------------------------------------------------------
  build-apache:
    name: Build & Push Apache
    runs-on: ubuntu-latest
    needs: test-backend
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Apache image
        id: build
        working-directory: app/apache
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/equihax-apache:${{ github.sha }}
          LATEST=${{ env.ECR_REGISTRY }}/equihax-apache:latest

          docker build \
            --build-context backend=../backend \
            -t $IMAGE \
            -t $LATEST \
            .

          docker push $IMAGE
          docker push $LATEST

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # Deploy to ECS — update service to use new images
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build-nginx, build-apache]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition equihax \
            --query taskDefinition \
            > task-definition.json

      - name: Update nginx image in task definition
        id: update-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: nginx
          image: ${{ needs.build-nginx.outputs.image }}

      - name: Update Apache image in task definition
        id: update-apache
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.update-nginx.outputs.task-definition }}
          container-name: apache
          image: ${{ needs.build-apache.outputs.image }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.update-apache.outputs.task-definition }}
          service: equihax
          cluster: equihax
          wait-for-service-stability: true

      - name: Notify on success
        if: success()
        run: echo "Deployed ${{ github.sha }} to ECS successfully"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed for ${{ github.sha }}"
